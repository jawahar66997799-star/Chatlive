<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<meta name="description" content="Join a Jawahar Live Sync room and listen to synchronized live audio on your device.">
<meta name="robots" content="index,follow">
<title>Jawahar Live Sync — Join a Room</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#080b10;color:#f7f9fc}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(900px 520px at 50% -10%,#1d2a50 0,#0d111a 52%,#080b10 100%)}
.shell{width:min(94vw,500px)}.brand{font-size:31px;font-weight:900;letter-spacing:-.04em}.tag{margin:8px 0 28px;color:#9ba7bb;font-size:15px;line-height:1.5}
.card{padding:28px;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:rgba(15,19,28,.9);backdrop-filter:blur(18px);box-shadow:0 28px 90px rgba(0,0,0,.42)}
h1{font-size:22px;margin:0 0 8px}.sub{color:#9ba7bb;font-size:14px;margin-bottom:22px}
label{display:block;color:#aab4c6;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
input{width:100%;border:1px solid rgba(255,255,255,.13);background:#0b0f17;color:#fff;border-radius:16px;padding:17px 18px;font-size:24px;font-weight:850;letter-spacing:.18em;text-align:center;outline:none}
input:focus{border-color:#7188ff;box-shadow:0 0 0 4px rgba(113,136,255,.12)}
button{width:100%;margin-top:14px;border:0;border-radius:16px;padding:16px 18px;font-size:16px;font-weight:900;background:#f8fafc;color:#080b10;cursor:pointer}
.hint{min-height:22px;margin-top:12px;color:#8d99ad;font-size:13px;text-align:center}.hint.bad{color:#ff8b94}
.feature{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.pill{padding:11px 8px;border:1px solid rgba(255,255,255,.07);border-radius:14px;color:#8995aa;font-size:11px;text-align:center}
.footer{margin-top:18px;text-align:center;color:#637086;font-size:11px}
@media(max-width:420px){.feature{grid-template-columns:1fr}.brand{font-size:27px}}
</style>
</head>
<body>
<main class="shell">
  <div class="brand">Jawahar Live Sync</div>
  <div class="tag">Synchronized live audio. One room code. No app required for listeners.</div>
  <section class="card">
    <h1>Join a room</h1>
    <div class="sub">Enter the 6-digit room code shared by the host.</div>
    <form id="joinForm" novalidate>
      <label for="roomCode">Room code</label>
      <input id="roomCode" name="room" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" aria-describedby="hint">
      <button type="submit">JOIN ROOM</button>
    </form>
    <div id="hint" class="hint">Listening opens directly in this browser.</div>
    <div class="feature">
      <div class="pill">LIVE AUDIO</div>
      <div class="pill">SYNCHRONIZED</div>
      <div class="pill">NO DOWNLOAD</div>
    </div>
  </section>
  <div class="footer">Jawahar Live Sync · secure room-code access</div>
</main>
<script type="module" src="/landing.js"></script>
</body>
</html>
