name: Vendor pinned Opus WASM

on:
  push:
    branches: [youtube-live-sync]
    paths:
      - '.github/workflows/vendor-opus-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: youtube-live-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract exact libopus-wasm 0.4.1 distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jls-opus package
          mkdir -p /tmp/jls-opus
          cd /tmp/jls-opus
          tgz=$(npm pack --silent libopus-wasm@0.4.1)
          tar -xzf "$tgz"

          cd "$GITHUB_WORKSPACE"
          rm -rf relay/web/vendor/libopus-wasm web/vendor/libopus-wasm
          mkdir -p relay/web/vendor/libopus-wasm web/vendor/libopus-wasm
          cp -a /tmp/jls-opus/package/dist/. relay/web/vendor/libopus-wasm/
          if [ -f /tmp/jls-opus/package/LICENSE ]; then
            cp /tmp/jls-opus/package/LICENSE relay/web/vendor/libopus-wasm/LICENSE.txt
          fi

          test -s relay/web/vendor/libopus-wasm/index.js
          test -s relay/web/vendor/libopus-wasm/generated/libopus.generated.mjs

          (
            cd relay/web/vendor/libopus-wasm
            find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum
          ) > relay/web/vendor/libopus-wasm/MANIFEST.sha256

          cp -a relay/web/vendor/libopus-wasm/. web/vendor/libopus-wasm/

      - name: Commit vendored decoder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A relay/web/vendor/libopus-wasm web/vendor/libopus-wasm
          if git diff --cached --quiet; then
            echo "Vendored decoder already matches pinned npm package"
            exit 0
          fi
          git commit -m "guest: vendor full libopus-wasm 0.4.1 distribution"
          git push origin HEAD:youtube-live-sync
