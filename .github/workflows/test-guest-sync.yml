name: Guest Sync CI

on:
  push:
    branches: [youtube-live-sync]
    paths:
      - 'relay/**'
      - '.github/workflows/test-guest-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic guest synchronization tests
        run: node relay/web/tests/sync-core.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Prepare relay dependencies
        working-directory: relay
        run: go mod tidy
      - name: Relay integration tests
        working-directory: relay
        run: go test ./...
