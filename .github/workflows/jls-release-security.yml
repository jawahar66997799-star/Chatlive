name: JLS Release Security

on:
  push:
    branches: [youtube-live-sync]
    paths:
      - 'app/**'
      - 'relay/**'
      - 'web/**'
      - 'main.go'
      - 'server.go'
      - 'protocol.go'
      - 'room.go'
      - 'go.mod'
      - 'go.sum'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/jls-release-security.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'relay/**'
      - 'web/**'
      - 'main.go'
      - 'server.go'
      - 'protocol.go'
      - 'room.go'
      - 'go.mod'
      - 'go.sum'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/jls-release-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Reject live-secret, mirror and decoder regressions
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE --             '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|JLS_HOST_SECRET[[:space:]]*=[[:space:]]*[^"<$[:space:]][^[:space:]]{20,}'             -- ':!*.md' ':!relay/web/vendor/**' ':!web/vendor/**'
          then
            echo "Potential hard-coded secret material found." >&2
            exit 1
          fi

          if git grep -nE 'cdn\.jsdelivr\.net/npm/libopus-wasm|unpkg\.com/.+libopus' -- relay/web web
          then
            echo "Runtime third-party Opus decoder dependency reintroduced." >&2
            exit 1
          fi

          test -s relay/web/vendor/libopus-wasm/index.js
          test -s relay/web/vendor/libopus-wasm/generated/libopus.generated.mjs
          test -s relay/web/vendor/libopus-wasm/MANIFEST.sha256

          cmp relay/main.go main.go
          cmp relay/server.go server.go
          cmp relay/protocol.go protocol.go
          cmp relay/room.go room.go
          cmp relay/web/index.html web/index.html
          cmp relay/web/landing.html web/landing.html
          cmp relay/web/landing.js web/landing.js
          cmp relay/web/robots.txt web/robots.txt
          cmp relay/web/player.js web/player.js
          cmp relay/web/decoder-worker.js web/decoder-worker.js
          cmp relay/web/sync-core.mjs web/sync-core.mjs
          cmp relay/web/worklet.js web/worklet.js

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Android CycloneDX SBOM and dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-audit

          cat > /tmp/jls-cyclonedx.init.gradle <<'EOF'
          import org.cyclonedx.gradle.CyclonedxPlugin
          import org.cyclonedx.gradle.CyclonedxDirectTask
          initscript {
            repositories { gradlePluginPortal() }
            dependencies {
              classpath 'org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin:3.4.1'
            }
          }
          rootProject {
            apply plugin: CyclonedxPlugin
          }
          gradle.projectsEvaluated {
            rootProject.project(':app').tasks.named('cyclonedxDirectBom', CyclonedxDirectTask) {
              includeConfigs = ['releaseRuntimeClasspath']
              skipConfigs = []
              testConfigs = []
              jsonOutput = project.layout.buildDirectory.file('reports/cyclonedx/jls-release-runtime.cdx.json')
            }
          }
          EOF

          gradle :app:cyclonedxDirectBom --init-script /tmp/jls-cyclonedx.init.gradle --stacktrace
          test -s app/build/reports/cyclonedx/jls-release-runtime.cdx.json
          cp app/build/reports/cyclonedx/jls-release-runtime.cdx.json release-audit/android.cdx.json

          gradle :app:dependencies --configuration debugRuntimeClasspath > release-audit/android-debug-runtime-dependencies.txt
          gradle :app:dependencies --configuration releaseRuntimeClasspath > release-audit/android-release-runtime-dependencies.txt

          if grep -E '[+][[:space:]]*$|:[[:digit:]]+\.[[:digit:]]+\.[+]' release-audit/android-*-runtime-dependencies.txt
          then
            echo "Dynamic dependency version detected." >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Install pinned OSV-Scanner v2.4.0
        shell: bash
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0

      - name: Scan Android SBOM, Go module and vendored Opus
        shell: bash
        run: |
          set +e

          "$(go env GOPATH)/bin/osv-scanner" scan source             -L app/build/reports/cyclonedx/jls-release-runtime.cdx.json             --format=json             --output-file=release-audit/android-osv.json
          android_rc=$?

          "$(go env GOPATH)/bin/osv-scanner" scan source             -L relay/go.mod             --format=json             --output-file=release-audit/go-osv.json
          go_rc=$?

          curl --fail --location --retry 3             -H 'Content-Type: application/json'             -d '{"package":{"ecosystem":"npm","name":"libopus-wasm"},"version":"0.4.1"}'             https://api.osv.dev/v1/query             > release-audit/libopus-wasm-osv.json
          opus_curl_rc=$?

          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path("release-audit/libopus-wasm-osv.json")
          if not p.exists():
              sys.exit(2)
          data=json.loads(p.read_text())
          vulns=data.get("vulns") or []
          print(f"libopus-wasm@0.4.1 OSV vulnerabilities: {len(vulns)}")
          if vulns:
              for v in vulns:
                  print(v.get("id","unknown"))
              sys.exit(1)
          PY
          opus_rc=$?

          {
            echo "JLS release dependency audit"
            echo "commit=$GITHUB_SHA"
            echo "osv_scanner=v2.4.0"
            echo "cyclonedx_gradle=3.4.1"
            echo "android_osv_exit=$android_rc"
            echo "go_osv_exit=$go_rc"
            echo "opus_query_exit=$opus_rc"
            echo "opus_curl_exit=$opus_curl_rc"
            echo "vendored_opus_manifest_sha256=$(sha256sum relay/web/vendor/libopus-wasm/MANIFEST.sha256 | awk '{print $1}')"
            echo "go_toolchain=$(go version)"
          } | tee release-audit/summary.txt

          set -e
          if [ "$android_rc" -ne 0 ] || [ "$go_rc" -ne 0 ] || [ "$opus_curl_rc" -ne 0 ] || [ "$opus_rc" -ne 0 ]; then
            exit 1
          fi

      - name: Go call-reachability vulnerability check
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd relay
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Go dependency inventory
        shell: bash
        run: |
          cd relay
          go list -m -json all > ../release-audit/go-modules.json

      - name: Upload release security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JLS-Release-Security-Audit
          path: release-audit/
          if-no-files-found: warn
