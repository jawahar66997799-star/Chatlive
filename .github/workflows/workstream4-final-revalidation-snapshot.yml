name: JLS Workstream 4 Final Revalidation Snapshot

on:
  push:
    branches:
      - workstream-4-benchmark-revalidation-final
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python and shell syntax
        run: |
          python3 -m py_compile tools/benchmark/jls_final_controller_sim.py tools/benchmark/jls_calibration.py tools/benchmark/jls_calibration_selftest.py tools/benchmark/jls_protocol_contract_check.py
          bash -n tools/benchmark/jls_failure_harness.sh

      - name: Final adaptive common-D simulation matrix
        run: |
          python3 tools/benchmark/jls_final_controller_sim.py \
            --listeners 20 --duration-s 180 \
            --json-out /tmp/jls-final-controller.json \
            --md-out /tmp/jls-final-controller.md
          cat /tmp/jls-final-controller.md

      - name: Acoustic calibration synthetic self-test
        run: python3 tools/benchmark/jls_calibration_selftest.py

      - name: Android relay guest static protocol check
        run: python3 tools/benchmark/jls_protocol_contract_check.py --root . --json-out /tmp/jls-contract.json

      - name: Guest deterministic sync and asset tests
        run: |
          node relay/web/tests/sync-core.test.mjs
          node relay/web/tests/assets.test.mjs

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Relay adaptive-delay, ring, protocol and integration tests
        working-directory: relay
        run: |
          go mod tidy
          go test ./...

      - name: Current-controller source assertions
        run: |
          grep -q 'JLS_DELAY_UP_US_PER_SEC", 250' relay/main.go
          grep -q 'JLS_DELAY_DOWN_US_PER_SEC", 150' relay/main.go
          grep -q 'JLS_DELAY_STATS_TTL_MS", 10000' relay/main.go
          grep -q 'JLS_DELAY_UPDATE_MS", 1000' relay/main.go
          grep -q 'const hysteresisNS = uint64(10 \* time.Millisecond)' relay/room.go
          grep -q 'upPerSec:.25,downPerSec:.15' relay/web/player.js
          grep -q 'TestAdaptiveCommonDelayProductionSubMillisecondSlew' relay/room_test.go
          grep -q 'server_instance_id' relay/main.go
          grep -q '/vendor/libopus-wasm/index.js' relay/web/decoder-worker.js
          ! grep -q 'cdn.jsdelivr.net' relay/web/decoder-worker.js

      - uses: actions/upload-artifact@v4
        with:
          name: jls-workstream4-final-revalidation
          path: |
            /tmp/jls-final-controller.json
            /tmp/jls-final-controller.md
            /tmp/jls-contract.json
