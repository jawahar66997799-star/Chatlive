name: JLS Benchmark CI

on:
  push:
    branches:
      - workstream-4-benchmarking-v2
  workflow_dispatch:

jobs:
  benchmark-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            tools/benchmark/jls_network_clock_sim.py \
            tools/benchmark/jls_buffer_sweep.py \
            tools/benchmark/jls_calibration.py \
            tools/benchmark/jls_calibration_selftest.py \
            tools/benchmark/jls_generate_e2e_signal.py \
            tools/benchmark/jls_log_analyzer.py \
            tools/benchmark/jls_protocol_contract_check.py

      - name: 20-listener simulation matrix
        run: |
          python3 tools/benchmark/jls_network_clock_sim.py \
            --listeners 20 --duration-s 300 --scenario all --mode both \
            --json-out /tmp/jls-sim.json --md-out /tmp/jls-sim.md
          cat /tmp/jls-sim.md

      - name: Adaptive common-delay sweep
        run: |
          python3 tools/benchmark/jls_buffer_sweep.py \
            --listeners 20 --duration-s 120 \
            --json-out /tmp/jls-buffer-sweep.json | tee /tmp/jls-buffer-sweep.md

      - name: Long mixed outage simulation
        run: |
          python3 tools/benchmark/jls_network_clock_sim.py \
            --listeners 20 --duration-s 240 --scenario mixed --mode adaptive \
            --json-out /tmp/jls-outage-sim.json --md-out /tmp/jls-outage-sim.md
          cat /tmp/jls-outage-sim.md

      - name: Acoustic calibration synthetic self-test
        run: python3 tools/benchmark/jls_calibration_selftest.py

      - name: Generate end-to-end reference signal
        run: |
          python3 tools/benchmark/jls_generate_e2e_signal.py \
            --duration-s 12 --out /tmp/jls-e2e.wav --manifest /tmp/jls-e2e.json
          test -s /tmp/jls-e2e.wav
          test -s /tmp/jls-e2e.json

      - name: Shell syntax
        run: |
          bash -n tools/benchmark/jls_failure_harness.sh
          bash -n tools/benchmark/jls_generate_e2e_video.sh

      - name: Build short reference video
        run: |
          bash tools/benchmark/jls_generate_e2e_video.sh 3 /tmp/jls-e2e.mov
          test -s /tmp/jls-e2e.mov

      - uses: actions/upload-artifact@v4
        with:
          name: jls-benchmark-simulated
          path: |
            /tmp/jls-sim.json
            /tmp/jls-sim.md
            /tmp/jls-e2e.json
            /tmp/jls-e2e.wav
            /tmp/jls-e2e.mov
            /tmp/jls-buffer-sweep.json
            /tmp/jls-buffer-sweep.md
            /tmp/jls-outage-sim.json
            /tmp/jls-outage-sim.md

  integration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android relay contract gate
        run: python3 tools/benchmark/jls_protocol_contract_check.py --root . --json-out /tmp/jls-contract.json

      - uses: actions/setup-go@v5
        if: always()
        with:
          go-version: '1.23.x'
          cache: false

      - name: Relay compile gate
        if: always()
        working-directory: relay
        run: |
          go mod tidy
          go test ./...
