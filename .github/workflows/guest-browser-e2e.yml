name: Guest Browser Playout E2E

on:
  push:
    branches: [youtube-live-sync]
    paths:
      - 'relay/**'
      - 'web/**'
      - '.github/workflows/guest-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-playout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser/audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0
          python -m pip install --upgrade pip
          python -m pip install playwright websockets opuslib
          python -m playwright install --with-deps chromium

      - name: Build relay
        working-directory: relay
        run: |
          GOTOOLCHAIN=local GOFLAGS=-mod=readonly go build -trimpath -o /tmp/jls-relay .

      - name: Run real Chromium Opus → AudioWorklet playout test
        env:
          JLS_RELAY_BIN: /tmp/jls-relay
        run: python relay/web/tests/browser-playout.e2e.py
