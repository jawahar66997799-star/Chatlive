<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>Jawahar Live Sync</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#080b10;color:#f7f9fc}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(900px 520px at 50% -10%,#1d2a50 0,#0d111a 52%,#080b10 100%)}
.card{width:min(94vw,460px);padding:30px;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:rgba(15,19,28,.88);backdrop-filter:blur(18px);box-shadow:0 28px 90px rgba(0,0,0,.42)}
.brand{font-size:24px;font-weight:850;letter-spacing:-.02em}.sub{margin:7px 0 26px;color:#9ba7bb;font-size:14px}.room{color:#8590a5;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.room b{color:#eef2f9;text-transform:none;letter-spacing:0}
.status{display:flex;align-items:center;gap:9px;margin-top:18px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#e3aa43;box-shadow:0 0 0 5px rgba(227,170,67,.08)}.dot.ok{background:#39d98a;box-shadow:0 0 0 5px rgba(57,217,138,.08)}.dot.bad{background:#ff6470;box-shadow:0 0 0 5px rgba(255,100,112,.08)}
button{width:100%;margin-top:24px;border:0;border-radius:16px;padding:16px 18px;font-size:16px;font-weight:850;letter-spacing:.02em;background:#f8fafc;color:#080b10;cursor:pointer}button:disabled{opacity:.58;cursor:default}
.note{margin-top:16px;color:#8d99ad;font-size:13px;line-height:1.5;min-height:39px}
details{margin-top:18px;border-top:1px solid rgba(255,255,255,.07);padding-top:14px;color:#8590a5}summary{cursor:pointer;font-size:12px;font-weight:750;user-select:none}pre{white-space:pre-wrap;word-break:break-word;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a8b2c4;margin:12px 0 0}
.footer{margin-top:17px;font-size:11px;color:#647086;text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Jawahar Live Sync</div>
  <div class="sub">One link. One tap only when the browser requires it.</div>
  <div class="room">Room <b id="room">—</b></div>
  <div class="status"><span id="dot" class="dot"></span><span id="state">Connecting…</span></div>
  <button id="join" disabled>TAP TO LISTEN</button>
  <div id="note" class="note">Connecting to the live room and calibrating its clock before you tap.</div>
  <details id="diag"><summary>Diagnostics</summary><pre id="diagText">Starting…</pre></details>
  <div class="footer">Live stream · synchronized playout · no song download</div>
</main>
<script type="module" src="/player.js"></script>
</body>
</html>
